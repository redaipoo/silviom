    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="شركة المجد للمطابخ الحديثة و P V C | البيضاء - ليبيا" />
    <meta property="og:description" content="صناعة وأعمال المطابخ، أبواب ونوافذ PVC | MDF، غرف نوم وديكورات داخلية حديثة - البيضاء، ليبيا." />

    <!-- Theme Color for Mobile Browser Chrome -->
    <meta name="theme-color" content="#02282D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts: Alexandria, Tajawal, Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600;700;800;900&family=Cinzel:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        background-color: #02282D;
        color: #F6F1E8;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #02282D;
        color: #BB9A6B;
        font-family: sans-serif;
        gap: 12px;
      }
      .loader-spin {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(187, 154, 107, 0.2);
        border-top-color: #BB9A6B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-brand-dark text-brand-ivory font-arabic antialiased selection:bg-brand-gold selection:text-brand-dark overflow-x-hidden min-h-screen">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spin"></div>
        <span style="font-size: 13px; color: #DFCAA7; font-weight: 600;">المجد للمطابخ الحديثة...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
